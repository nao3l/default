name: Deploy access log worker

# 閲覧記録の受け口を Cloudflare Workers に公開する。手動で実行する
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test

      - name: データベース ID を設定ファイルに反映
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          test -n "$D1_DATABASE_ID" || { echo "::error::Variables に D1_DATABASE_ID を設定してください"; exit 1; }
          sed -i "s/REPLACE_WITH_YOUR_DATABASE_ID/$D1_DATABASE_ID/" wrangler.toml

      - name: 保存日数を反映
        env:
          RETENTION_DAYS: ${{ vars.ACCESS_LOG_RETENTION_DAYS }}
        if: env.RETENTION_DAYS != ''
        run: sed -i "s/^RETENTION_DAYS = .*/RETENTION_DAYS = \"$RETENTION_DAYS\"/" wrangler.toml

      - name: データベースの表を作成・更新
        run: npx wrangler d1 migrations apply phrasebook-access-log --remote

      - name: 受け口を公開
        run: npx wrangler deploy

      - name: 閲覧画面の合言葉を登録
        env:
          ADMIN_TOKEN: ${{ secrets.ACCESS_LOG_ADMIN_TOKEN }}
        run: |
          test -n "$ADMIN_TOKEN" || { echo "::error::Secrets に ACCESS_LOG_ADMIN_TOKEN を設定してください"; exit 1; }
          printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
